[workspace]
resolver = "3"
members = ["crates/dynamoxy-core", "crates/dynamoxy-py"]

# The single version of the project: the Python package takes it from the binding crate.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/kalaspuff/dynamoxy"
homepage = "https://github.com/kalaspuff/dynamoxy"
authors = ["Carl Oscar Aaro <hello@carloscar.com>"]

[workspace.dependencies]
dynamoxy-core = { path = "crates/dynamoxy-core", version = "0.4.0" }
async-trait = "0.1"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3", features = ["hardcoded-credentials"] }
# The default features without `rustls`, which builds the SDK's legacy hyper 0.14 client with
# rustls 0.21 and rustls-webpki 0.101 (no security fixes). `BehaviorVersion::latest()` uses the
# hyper 1.x client of `default-https-client` anyway.
aws-sdk-dynamodb = { version = "1.130", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
fastrand = "2"
parking_lot = "0.12"
pyo3 = { version = "0.29", features = ["abi3-py312"] }
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Local/editable builds: optimized but quick to compile.
[profile.release]
lto = false
codegen-units = 16
strip = "symbols"

# Published wheels (`maturin build --profile dist`): maximum optimization.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Dependencies stay reasonably fast in debug builds and tests.
[profile.dev.package."*"]
opt-level = 1
