name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead (include the full error).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A small script, ideally with `dynamoxy.testing.memory_client()` so it runs without AWS.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: dynamoxy (`dynamoxy version`), Python, OS and architecture; DynamoDB, DynamoDB Local or an emulator.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant `dynamoxy.*` log lines (they contain no item data).
      render: text
